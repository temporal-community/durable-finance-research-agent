[project]
name = "durable-finance-research-agent"
version = "0.1.0"
description = "Temporal workshop: durable Strands finance research agent (sample data, not financial advice)"
requires-python = ">=3.12"
dependencies = [
  "strands-agents[litellm]>=1.60,<1.61",
  "temporalio[strands-agents]>=1.34,<1.35",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mitmproxy>=11",
  "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
